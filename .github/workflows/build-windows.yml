name: Windows build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build Windows app folder
        run: npx electron-builder --win --x64 --dir
      - name: Zip unpacked app
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $src = "release\win-unpacked"
          $zip = "release\Slice-$ver-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$src\*" -DestinationPath $zip
          Get-Item $zip | Format-List Name, Length
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slice-windows-x64
          path: release/Slice-*-win-x64.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Slice-*-win-x64.zip
          generate_release_notes: true
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
